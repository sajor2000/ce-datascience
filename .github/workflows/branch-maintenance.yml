name: Weekly Branch Maintenance

on:
  schedule:
    - cron: "23 17 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build branch-maintenance report
        run: bun scripts/maintenance/report-branch-candidates.ts > "$RUNNER_TEMP/branch-maintenance.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish branch-maintenance report
        if: always()
        run: cat "$RUNNER_TEMP/branch-maintenance.md" >> "$GITHUB_STEP_SUMMARY"

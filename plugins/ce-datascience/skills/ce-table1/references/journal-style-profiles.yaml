version: 1
description: Journal and publication style profiles used by ce-datascience table, figure, and manuscript workflows.
profiles:
  jama:
    label: JAMA Network clinical research style
    tables:
      frequency_format: "No. (%)"
      percent_decimals_under_100: 0
      require_numerator_denominator: true
      compare_across_columns: true
      avoid_duplicate_figure_table_data: true
    figures:
      font_family: Arial
      min_font_size_pt: 8
      preferred_vector_formats:
        - PDF
        - EPS
        - SVG
      accepted_raster_formats:
        - TIFF
        - PNG
        - JPG
      require_caption: true
      require_alt_text: true
      require_source_data: true
    captions:
      require_descriptive_title: true
      require_abbreviation_expansion: true
      require_uncertainty_definition: true
    manuscript:
      require_reporting_guideline: true
      require_analyst_contribution_disclosure: true
      require_separate_main_figures: true
    sources:
      - https://jamanetwork.com/journals/jama/pages/instructions-for-authors
  generic-biomedical:
    label: Generic biomedical journal profile
    tables:
      frequency_format: "n (%)"
      percent_decimals_under_100: 0
      require_numerator_denominator: true
      compare_across_columns: true
      avoid_duplicate_figure_table_data: true
    figures:
      font_family: Arial
      min_font_size_pt: 8
      preferred_vector_formats:
        - PDF
        - SVG
      accepted_raster_formats:
        - PNG
        - TIFF
        - JPG
      require_caption: true
      require_alt_text: true
      require_source_data: true
    captions:
      require_descriptive_title: true
      require_abbreviation_expansion: true
      require_uncertainty_definition: true
    manuscript:
      require_reporting_guideline: true
      require_analyst_contribution_disclosure: false
      require_separate_main_figures: false
    sources:
      - https://www.equator-network.org/reporting-guidelines/
  clinical-standard:
    label: Clinical publication style
    tables:
      frequency_format: "No. (%)"
      percent_decimals_under_100: 0
      require_numerator_denominator: true
      compare_across_columns: true
      avoid_duplicate_figure_table_data: true
    figures:
      font_family: Arial
      font_fallbacks:
        - Helvetica
        - Liberation Sans
        - DejaVu Sans
      min_font_size_pt: 8
      figure_title_pt: 12
      figure_title_weight: bold
      axis_title_pt: 10
      tick_label_pt: 8
      legend_text_pt: 8
      annotation_pt: 8
      panel_label_pt: 12
      panel_label_weight: bold
      panel_label_case: upper
      widths_in:
        single_column: 3.5
        one_and_half_column: 5.0
        double_column: 7.0
      max_height_in: 9.0
      design_at_final_size: true
      preferred_vector_formats:
        - PDF
        - EPS
        - SVG
      accepted_raster_formats:
        - TIFF
        - PNG
      raster_dpi: 300
      line_art_raster_dpi: 600
      embed_fonts: true
      background: white
      transparency_in_eps: false
      spines:
        - left
        - bottom
      axis_line_width_pt: 0.75
      tick_direction: out
      major_gridlines: none
      minor_gridlines: none
      count_axes_start_at_zero: true
      ratio_axes_log_scale: true
      palette: okabe-ito
      palette_hex:
        - "#0072B2"
        - "#D55E00"
        - "#009E73"
        - "#E69F00"
        - "#CC79A7"
        - "#56B4E9"
        - "#000000"
        - "#F0E442"
      max_categories: 6
      grayscale_legible: true
      three_d: false
      pie_charts: false
      legend_frame: false
      legend_position: outside-or-whitespace
      in_figure_title: false
      require_caption: true
      require_alt_text: true
      require_source_data: true
      require_number_at_risk_for_survival: true
    captions:
      require_descriptive_title: true
      title_case_title: true
      require_abbreviation_expansion: true
      require_uncertainty_definition: true
      require_n_per_group: true
      require_method_statement: true
    manuscript:
      require_reporting_guideline: true
      require_analyst_contribution_disclosure: false
      require_separate_main_figures: true
    sources:
      - https://jamanetwork.com/journals/jama/pages/instructions-for-authors
      - https://www.equator-network.org/reporting-guidelines/

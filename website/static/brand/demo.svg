<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5"><title id="t">Methodsmith terminal demo</title><desc id="d">Terminal replay on synthetic data. /method-workflow detects an observational study and shows the lifecycle card with method-sap as the next step. /method-sap links claim C1 to an ICH E9(R1) estimand and lists two decisions that block finalization. /method-review reports two P1, one P2 and one P3 finding, applies small-cell suppression, and returns Not ready.</desc><rect width="1200" height="615" rx="14" fill="#11141A"/><rect x="0.75" y="0.75" width="1198.5" height="613.5" rx="13.5" fill="none" stroke="#2E3440" stroke-width="1.5"/><line x1="0" y1="44" x2="1200" y2="44" stroke="#2E3440" stroke-width="1.5"/><circle cx="26" cy="22" r="6" fill="#2E3440"/><circle cx="46" cy="22" r="6" fill="#2E3440"/><circle cx="66" cy="22" r="6" fill="#2E3440"/><text x="600.0" y="27" fill="#A3AAB5" text-anchor="middle" font-size="13">methodsmith demo  |  synthetic data</text><text x="1164" y="593" fill="#7D8592" text-anchor="end" font-size="12.5">Scripted replay on synthetic data. Output abridged from the skills&#x27; defined formats.</text><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0257;0.3265" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/><clipPath id="c0"><rect x="58" y="60.5" height="25" width="0"><animate attributeName="width" values="0;0.0;9.6;19.1;28.7;38.2;47.8;57.3;66.9;76.4;86.0;95.5;105.1;114.6;124.2;133.7;143.2;152.8" keyTimes="0;0.0257;0.0277;0.0296;0.0316;0.0335;0.0355;0.0374;0.0394;0.0413;0.0432;0.0452;0.0471;0.0491;0.0510;0.0530;0.0549;0.0569" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath><text x="36" y="76" fill="#E57A50" font-weight="600">&gt;</text><text x="58" y="76" fill="#ECE8E0" font-weight="600" xml:space=
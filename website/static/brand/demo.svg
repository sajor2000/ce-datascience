Times="0;0.4811;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="201" fill="#D5D1C9" xml:space="preserve" opacity="0">    treatment      first dose &lt; 1 h vs 1-3 h after onset; time zero = onset<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4880;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="226" fill="#D5D1C9" xml:space="preserve" opacity="0">    population     adults, first sepsis admission (synthetic, n = 4,812)<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4949;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="251" fill="#D5D1C9" xml:space="preserve" opacity="0">    variable       death within 30 days of time zero<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5017;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="276" fill="#D5D1C9" xml:space="preserve" opacity="0">    intercurrent   transfer out -&gt; treatment policy<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5086;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="301" fill="#D5D1C9" xml:space="preserve" opacity="0">    summary        marginal risk difference, g-computation, bootstrap CI<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5154;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="351" fill="#D5D1C9" xml:space="preserve" opacity="0">  Target trial     clone-censor-weight for the 1-3 h grace period<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5257;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="376" fill="#D5D1C9" xml:space="preserve" opacity="0">  Diagnostics      weight distribution, positivity by site, E-value<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5326;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="426" fill="#E5B65C" xml:space="preserve" opacity="0">  Blocks finalization (2)<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5429;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="451" fill="#E5B65C" xml:space="preserve" opacity="0">    D4  missing lactate (18%): MAR assumed, no MNAR tipping-point analysis<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5497;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="476" fill="#E5B65C" xml:space="preserve" opacity="0">    D6  ICU-transfer exclusion stated only in prose; add a decision row<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5566;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7156;0.9850" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/><clipPath id="c2"><rect x="58" y="60.5" height="25" width="0"><animate attributeName="width" values="0;0.0;9.6;19.2;28.8;38.3;47.9;57.5;67.1;76.7;86.3;95.9;105.4;115.0;124.6;134.2" keyTimes="0;0.7156;0.7175;0.7195;0.7214;0.7234;0.7253;0.7273;0.7292;0.7312;0.7331;0.7351;0.7370;0.7390;0.7409;0.7429" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath><text x="36" y="76" fill="#E57A50" font-weight="600">&gt;</text><text x="58" y="76" fill="#ECE8E0" font-weight="600" xml:space="preserve" clip-path="url(#c2)">/method-review</text><text x="36" y="101" fill="#A3AAB5" xml:space="preserve" opacity="0">Reviewers: methods, causal-inference, reproducibility, python-ds,<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7621;1.0000" dur="23.33s" repeatCount="indefinite" calcMode="discrete"/></text><text x="36" y="126" fill="#A3AAB5" xml:space="preserve" opacity="0">  phi-leak, reporting-checklist (STROBE + RECORD), +4 more<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7690;1.